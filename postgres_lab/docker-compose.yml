services:
  postgres:
    image: postgres:16-alpine
    container_name: zero_to_qa_postgres
    environment:
      POSTGRES_DB: zero_to_qa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zero_to_qa"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
